<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FairGo Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f8;color:#192d46;font:1rem/1.5 "Segoe UI",sans-serif}header{background:#192d46;color:white;padding:.9rem max(5vw,1rem);font-weight:700}main{max-width:75rem;margin:auto;padding:1rem}.grade{display:grid;grid-template-columns:minmax(16rem,1fr) minmax(0,2fr);gap:1rem;align-items:start}section,details{background:white;border:1px solid #cbd3df;border-radius:.75rem;padding:1.2rem;margin-bottom:1rem}label{display:block;margin:.6rem 0}input,select,textarea,button{font:inherit;padding:.5rem;border:1px solid #728298;border-radius:.35rem}input:not([type=checkbox]),textarea{width:100%}button{background:#203d63;color:white;cursor:pointer;margin:.2rem}button:disabled{opacity:.55}li{margin:.45rem 0;overflow-wrap:anywhere}img{max-width:100%;max-height:65vh;object-fit:contain}textarea{display:block}h1,h2,h3{line-height:1.2}summary{cursor:pointer}button.rejeitar{background:#853334}@media(max-width:720px){.grade{grid-template-columns:1fr}}
</style>
<header>FAIRGO · Administração</header>
<main>
<h1>Análise de cadastros</h1>
<section>
<form id="acesso"><label>Token administrativo<input id="token" type="password" autocomplete="off" required></label>
<button>Carregar pendentes</button><button type="reset">Limpar</button></form>
</section>
<p id="aviso" role="status"></p>
<div class="grade">
<div><section><h2>Cadastros pendentes</h2><ul id="fila"></ul></section>
<details><summary>Consultar por ID</summary><form id="busca">
<label>Tipo <select id="tipo"><option value="MOTORISTA">Motorista</option><option value="VEICULO">Veículo</option></select></label>
<label>ID do cadastro<input id="codigo" required pattern="[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}"></label><button>Consultar</button></form></details></div>
<section id="resultado" hidden>
<h2 id="titulo"></h2><p id="situacao"></p><p id="dados"></p>
<h3>Documentos cadastrados</h3><ul id="documentos"></ul>
<div id="visor" hidden><img id="imagem" alt=""><br><button id="fechar">Fechar documento</button></div>
<form id="decisao"><label>Justificativa<textarea id="motivo" maxlength="500" required></textarea></label>
<button value="APROVADO">Aprovar</button><button class="rejeitar" value="REJEITADO">Rejeitar</button></form>
<h3>Histórico de decisões</h3><ul id="historico"></ul></section></div>
</main><script src="painel.js"></script></html>
