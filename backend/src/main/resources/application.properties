spring.datasource.url=${FAIRGO_DB_URL}
spring.datasource.username=${FAIRGO_DB_USER}
spring.datasource.password=${FAIRGO_DB_PASSWORD}
spring.sql.init.mode=always
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
server.address=${FAIRGO_BIND_ADDRESS:127.0.0.1}
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.file-size-threshold=5MB
server.error.include-message=never
server.error.include-binding-errors=never
fairgo.document-key=${FAIRGO_DOCUMENT_KEY}
spring.sql.init.schema-locations=classpath:schema.sql,classpath:validacao.sql,classpath:driver.sql,classpath:identidade.sql

server.forward-headers-strategy=none
