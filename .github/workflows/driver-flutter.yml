name: FairGo Driver Flutter
on:
  push:
    paths: ['apps/driver/**', '.github/workflows/driver-flutter.yml']
  pull_request:
    paths: ['apps/driver/**', '.github/workflows/driver-flutter.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: apps/driver/pubspec.yaml
          cache: true
      - name: Conferir SDK e resolver dependências fixadas
        run: |
          flutter --version --machine | jq -e '.frameworkVersion == "3.50.1" and .dartSdkVersion == "3.14.0"'
          flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Compilar APK debug ARM64
        run: flutter build apk --debug --no-pub --target-platform android-arm64 --dart-define=FAIRGO_API_ORIGIN=http://127.0.0.1:8080
      - name: Verificar ABI e API mínima no APK
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          unzip -Z1 "$apk" > "$RUNNER_TEMP/driver-apk-files"
          grep -Fx 'lib/arm64-v8a/libflutter.so' "$RUNNER_TEMP/driver-apk-files"
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/driver-badging"
          grep -F "sdkVersion:'29'" "$RUNNER_TEMP/driver-badging"
